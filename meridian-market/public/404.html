<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Meridian Market</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <style>
    .nf { text-align: center; padding-block: 5rem 3rem; }
    .nf .sign { display: inline-flex; align-items: baseline; gap: .75rem; background: var(--ink); color: var(--paper); border-radius: var(--r-lg); padding: 1rem 2rem; margin-bottom: 2rem; }
    .nf .sign b { font-family: var(--font-display); font-size: 3.5rem; color: var(--marigold); line-height: 1; }
    .nf p { margin: 1rem auto 2rem; }
    .nf form { display: flex; gap: .5rem; max-width: 440px; margin: 0 auto 1.5rem; }
  </style>
</head>
<body>
<header id="site-header"></header>
<main id="main" class="wrap nf">
  <div class="sign"><b>404</b><span>Aisle not found</span></div>
  <h1>This page isn't on the shelves</h1>
  <p class="lede">The link may be old or mistyped. Search for what you wanted, or head back to the store directory.</p>
  <form action="/search/" role="search">
    <label class="sr-only" for="nf-q">Search products</label>
    <input class="input" id="nf-q" name="q" placeholder="Search products">
    <button class="btn btn-primary">Search</button>
  </form>
  <div class="flex" style="justify-content:center;flex-wrap:wrap">
    <a href="/" class="btn btn-ghost">Go to the homepage</a>
    <a href="/products/" class="btn btn-ghost">Browse all products</a>
  </div>
</main>
<footer id="site-footer"></footer>
</body>
</html>
